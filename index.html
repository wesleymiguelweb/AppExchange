<!doctype html>
<html lang="pt-BR" data-theme="dark" data-font="inter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#08090D" />
    <meta
      name="description"
      content="Hermes: carteira multi-moeda, conversor, gráficos e um navegador de dados de câmbio com dados de referência do Banco Central Europeu via Frankfurter."
    />
    <title>Hermes · Carteira e câmbio</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash claro/escuro.
      (function () {
        try {
          var stored = localStorage.getItem('hermes.theme');
          var theme = stored;
          try {
            theme = JSON.parse(stored);
          } catch (error) {
            /* valor legado sem JSON */
          }
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';

          var font = localStorage.getItem('hermes.font.v1');
          try {
            font = JSON.parse(font);
          } catch (error) {
            /* valor legado sem JSON */
          }
          var fonts = ['inter', 'manrope', 'sora', 'grotesk', 'plex', 'outfit'];
          document.documentElement.dataset.font =
            fonts.indexOf(font) >= 0 ? font : 'inter';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.font = 'inter';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
